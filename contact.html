<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenție de Marketing Digital | Contactează-ne</title>
  <meta name="description"
    content="Completează formularul pentru a intra în contact cu noi și hai să discutăm despre cum putem să-ți ajutăm afacerea să crească.">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" as="style">
    <link rel="stylesheet" href="./css/master.css">
    
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/icons/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icons/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="IDL Media" />
    <link rel="manifest" href="/icons/site.webmanifest" />
</head>

<body>


  <!-- Toast pentru mesaje -->
  <div id="toast-container"></div>

  <!-- Header -->
  <header>
    <a href="index.html"><img src="./img/logo.png" width="150px" alt="IDL Media Logo" class="logo"></img></a>
  </header>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Selectează div-ul placeholder unde va fi încărcat scriptul
      const scriptPlaceholder = document.getElementById('calendly-script-placeholder');

      // Funcție care va adăuga scriptul Calendly în pagina ta
      const loadCalendlyScript = () => {
        const script = document.createElement('script');
        script.src = "https://assets.calendly.com/assets/external/widget.js";
        script.async = true;
        script.onload = function () {
          console.log('Calendly script loaded');
        };
        scriptPlaceholder.appendChild(script);
      };

      // Crează un IntersectionObserver pentru a observa când secțiunea este vizibilă
      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          // Dacă secțiunea devine vizibilă (pe ecran)
          if (entry.isIntersecting) {
            loadCalendlyScript(); // Încarcă scriptul Calendly
            observer.unobserve(entry.target); // Oprește observarea
          }
        });
      });

      // Observă div-ul care conține placeholder-ul pentru script
      observer.observe(scriptPlaceholder);
    });

  </script>

  <!-- Secțiune Contact -->
  <section class="contact-section">
    <div class="container contact-wrapper">
      <div class="contact-text fade-in fade-in--early">
        <h2>Hai să vorbim despre cum îți putem crește afacerea</h2>
        <p>Completează formularul de mai jos sau rezervă direct o întâlnire.<br> Ești pregătit pentru o transformare?
        </p>
      </div>

      <div class="contact-grid fade-in fade-in--late">
        <!-- Formular de contact -->
        <form id="contactForm" class="contact-form">
          <label for="nume">Nume *</label>
          <input type="text" id="nume" name="nume" required>

          <label for="prenume">Prenume *</label>
          <input type="text" id="prenume" name="prenume" required>

          <label for="website">Website / Social Media / Nume Companie *</label>
          <input type="text" id="website" name="website" required>

          <label for="email">Adresă de email *</label>
          <input type="email" id="email" name="email" required>

          <label for="telefon">Număr de telefon *</label>
          <input type="text" id="telefon" name="telefon" required>

          <label for="mesaj">Mesaj</label>
          <textarea id="mesaj" name="mesaj" rows="5"></textarea>

          <p class="form-note">* Câmpurile marcate sunt obligatorii</p>

          <button type="submit">Trimite</button>
        </form>

        <!-- Container pentru Calendly -->
        <div class="calendly-container calendly-inline-widget">
          <div id="calendly-script-placeholder"></div>
          <!-- <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script> -->
          <iframe src="https://calendly.com/denisilie2/meeting" width="100%" height="100%" frameborder="0"
            scrolling="no" title="Calendly - Book a Meeting">
          </iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    &copy; 2025 <a href="index.html">IDL Media.</a> Toate drepturile rezervate.
  </footer>

  <script>
    function showToast(message, type = "success", position = "bottom-right") {
      let container = document.querySelector(`.toast-container.${position}`);
      // Dacă nu există containerul, îl creăm
      if (!container) {
        container = document.createElement("div");
        container.classList.add("toast-container", position);
        document.body.appendChild(container);
      }

      const toast = document.createElement("div");
      toast.classList.add("toast", type);
      toast.innerText = message;

      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
        // Ștergem containerul dacă nu mai are copii
        if (container.children.length === 0) container.remove();
      }, 4000);
    }

    window.addEventListener('load', function () {
      emailjs.init("KLLAReCi5FQO8UTNL"); // Folosește ID-ul tău real pentru EmailJS
    });


    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showToast("Te rugăm să introduci o adresă de email validă.", "error", "bottom-right");
        return;
      }

      const form = e.target;
      const formData = new FormData(form);
      const formObject = {};
      formData.forEach((value, key) => {
        formObject[key] = value;
      });

      emailjs.send("service_7tlj2us", "template_caymigt", formObject)
        .then(function (response) {
          console.log("Mesaj trimis cu succes", response);
          showToast("Mulțumim! Mesajul tău a fost trimis.", "success", "bottom-right");
          form.reset();
        }, function (error) {
          console.error("Eroare la trimiterea formularului", error);
          showToast("A apărut o eroare. Te rugăm să încerci mai târziu.", "error", "bottom-right");
        });
    });
  </script>
</body>

</html>
